# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Limiteur de tentatives de connexion (config/packages/rate_limiter.yaml), injecté par
            # nom d'argument dans App\Controller\SessionController.
            $connexionLimiter: '@limiter.connexion'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Fichier SQLite hors de public/ (voir doc/modelisation-bdd.md)
    App\Database\Database:
        arguments:
            $path: '%kernel.project_dir%/var/data/menus.sqlite'

    # Schéma de référence, installé par la commande app:db:init
    App\Database\SchemaInstaller:
        arguments:
            $schemaPath: '%kernel.project_dir%/config/schema.sql'

    # Identifiants du compte unique (jalon 1b), configurés hors dépôt dans .env.local.
    App\Security\Credentials:
        arguments:
            $identifiant: '%env(APP_AUTH_USER)%'
            $passwordHash: '%env(APP_AUTH_PASSWORD_HASH)%'

    # Connexion PDO injectée dans les dépôts de src/Database/, pour qu'ils puissent aussi
    # travailler sur une base en mémoire dans les tests. La connexion reste paresseuse.
    PDO:
        class: PDO
        factory: ['@App\Database\Database', 'connection']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Base SQLite dédiée aux tests fonctionnels qui démarrent le kernel (jalon 1b) : jamais
        # le fichier de développement. Effacée et réinstallée à chaque test, voir
        # tests/Support/FunctionalTestCase.php.
        App\Database\Database:
            arguments:
                $path: '%kernel.project_dir%/var/data/menus.test.sqlite'
